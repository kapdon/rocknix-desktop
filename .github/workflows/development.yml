name: Development bundle
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: development-bundle
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install archive ownership support
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Check source
        run: bash tests/check.sh
      - name: Set up cached builder
        uses: docker/setup-buildx-action@v3
      - name: Build mount-aware Debian packages on native ARM64
        uses: docker/build-push-action@v6
        with:
          context: build-support/trash
          file: build-support/trash/Dockerfile.packages
          target: artifact
          platforms: linux/arm64
          outputs: type=local,dest=build/trash-packages
          cache-from: type=gha,scope=rocknix-trash-arm64
          cache-to: type=gha,scope=rocknix-trash-arm64,mode=max
      - name: Build upstream touchscreen launcher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-support/fuzzel/Dockerfile
          target: artifact
          platforms: linux/arm64
          outputs: type=local,dest=build/fuzzel
          cache-from: type=gha,scope=rocknix-fuzzel-arm64
          cache-to: type=gha,scope=rocknix-fuzzel-arm64,mode=max
      # Populate this builder from the cross-run cache. build-rootfs.sh uses
      # the same builder, so its build/load reuses these layers locally.
      - name: Cache ARM64 runtime layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rootfs
          platforms: linux/arm64
          build-contexts: |
            trash-packages=./build/trash-packages
            fuzzel-artifacts=./build/fuzzel
          outputs: type=cacheonly
          cache-from: type=gha,scope=rocknix-desktop-arm64
          cache-to: type=gha,scope=rocknix-desktop-arm64,mode=max
      - name: Cache trusted ARM64 host tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build-support/lxc/Dockerfile.host-tools
          platforms: linux/arm64
          outputs: type=cacheonly
          cache-from: type=gha,scope=rocknix-host-tools-arm64
          cache-to: type=gha,scope=rocknix-host-tools-arm64,mode=max
      - name: Build ARM64 runtime
        env:
          ROCKNIX_TRASH_PACKAGES_DIR: ${{ github.workspace }}/build/trash-packages
        run: bash build-rootfs.sh
      - name: Publish rolling bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-development.sh
