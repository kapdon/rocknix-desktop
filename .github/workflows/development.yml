name: Development build
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Build and cache this branch without updating any release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: development-bundle
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev' || inputs.benchmark
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute archive cache keys
        id: keys
        run: python3 scripts/component-cache.py keys
      - name: Cache guest-base archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/guest-base
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-guest-base-${{ steps.keys.outputs['guest-base'] }}
      - name: Cache host-runtime archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/host-runtime
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-host-runtime-${{ steps.keys.outputs['host-runtime'] }}
      - name: Cache firefox-media archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/firefox-media
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-firefox-media-${{ steps.keys.outputs['firefox-media'] }}
      - name: Cache mpv-media archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/mpv-media
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-mpv-media-${{ steps.keys.outputs['mpv-media'] }}
      - name: Cache fuzzel archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/fuzzel
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-fuzzel-${{ steps.keys.outputs['fuzzel'] }}
      - name: Cache keyboard archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/keyboard
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-keyboard-${{ steps.keys.outputs['keyboard'] }}
      - name: Cache xwayland archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/xwayland
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-xwayland-${{ steps.keys.outputs['xwayland'] }}
      - name: Cache integration archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/integration
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-integration-${{ steps.keys.outputs['integration'] }}
      - name: Cache trash-packages archive
        uses: actions/cache@v4
        with:
          path: build/actions-cache/trash-packages
          key: archive-v2-${{ runner.os }}-${{ runner.arch }}-trash-packages-${{ steps.keys.outputs['trash-packages'] }}
      - name: Restore finished archives and resolve misses
        id: components
        run: |
          python3 scripts/component-cache.py restore
          python3 scripts/build-components.py --plan
      - name: Install archive ownership support
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Check source
        run: bash tests/check.sh
      - name: Set up builder only for missing compiled components
        if: steps.components.outputs.needs_docker == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Expose BuildKit cache service to the component builder
        if: steps.components.outputs.needs_docker == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL']) {
              if (process.env[name]) {
                if (name.endsWith('TOKEN')) core.setSecret(process.env[name]);
                core.exportVariable(name, process.env[name]);
              }
            }
      - name: Build only missing components
        run: python3 scripts/build-components.py
      - name: Stage finished archives for Actions cache
        run: python3 scripts/component-cache.py stage
      - name: Validate benchmark without publishing
        if: inputs.benchmark
        run: python3 scripts/publish-components.py --repository "$GITHUB_REPOSITORY" --components-only
      - name: Publish tarball and checksum
        if: ${{ !inputs.benchmark }}
        run: python3 scripts/publish-components.py --repository "$GITHUB_REPOSITORY"
      - name: Record the published changelog on dev
        if: ${{ !inputs.benchmark }}
        run: python3 scripts/record-development-changelog.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"
      - name: Record component timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-build-timings
          path: |
            dist/components/plan.json
            dist/components/timings.json
            dist/components/packaging-timings.json
            dist/components/release.json
            dist/components/development-notes.md
            dist/components/CHANGELOG.md
          if-no-files-found: ignore
