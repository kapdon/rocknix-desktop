name: Checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install archive ownership support
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Validate scripts and installer
        run: bash tests/check.sh
