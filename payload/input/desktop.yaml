# InputPlumber profile for ROCKNIX XFCE Desktop Mode.
version: 1
kind: DeviceProfile
name: ROCKNIX XFCE Desktop
description: Retroid controls mapped to desktop mouse and keyboard actions
target_devices:
  - ds5
  - keyboard
  - mouse
mapping:
  - name: Toggle On-Screen Keyboard
    source_event:
      gamepad:
        button: LeftStick
    target_events:
      - keyboard: KeyF13

  - name: Guide
    source_event:
      gamepad:
        button: Guide
    target_events:
      - dbus: ui_guide

  - name: Quick Access
    source_event:
      gamepad:
        button: QuickAccess
    target_events:
      - dbus: ui_quick

  - name: D-Up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyUp

  - name: D-Down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyDown

  - name: D-Left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyLeft

  - name: D-Right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyRight

  - name: Left
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: left
          deadzone: 0.3
    target_events:
      - keyboard: KeyA

  - name: Right
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: right
          deadzone: 0.3
    target_events:
      - keyboard: KeyD

  - name: Up
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.3
    target_events:
      - keyboard: KeyW

  - name: Down
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.3
    target_events:
      - keyboard: KeyS

  - name: Pointer
    source_event:
      gamepad:
        axis:
          name: RightStick
    target_events:
      - mouse:
          motion:
            speed_pps: 800

  - name: Escape
    source_event:
      gamepad:
        button: Start
    target_events:
      - keyboard: KeyEsc

  - name: Tab
    source_event:
      gamepad:
        button: Select
    target_events:
      - keyboard: KeyTab

  - name: Space
    source_event:
      gamepad:
        button: South
    target_events:
      - keyboard: KeySpace

  - name: Refresh
    source_event:
      gamepad:
        button: North
    target_events:
      - keyboard: KeyR

  - name: Find
    source_event:
      gamepad:
        button: West
    target_events:
      - keyboard: KeyF

  - name: Action
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyE

  - name: Left Click
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.2
    target_events:
      - mouse:
          button: Left

  - name: Right Click
    source_event:
      gamepad:
        trigger:
          name: RightTrigger
          deadzone: 0.2
    target_events:
      - mouse:
          button: Right

  - name: Scroll Up
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - mouse:
          wheel:
            direction: up

  - name: Scroll Down
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - mouse:
          wheel:
            direction: down
