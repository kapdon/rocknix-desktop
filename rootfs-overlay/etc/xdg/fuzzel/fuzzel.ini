[main]
font=Roboto:size=18
use-bold=yes
dpi-aware=no
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,categories,keywords,comment
show-actions=no
terminal=foot -e
anchor=center
lines=7
width=40
horizontal-pad=16
vertical-pad=16
inner-pad=6
line-height=44
layer=overlay
keyboard-focus=exclusive
prompt="APPS  "
placeholder=Search desktop apps

[colors]
background=111111fa
text=ffffff77
prompt=ffffffff
placeholder=ffffff77
input=ffffffff
match=ffffffff
selection=444444ff
selection-text=ffffffff
selection-match=ffffffff
border=111111ff

[border]
width=0
radius=0

[key-bindings]
execute=Return KP_Enter
cancel=Escape
prev=Up Control+p
next=Down Control+n
