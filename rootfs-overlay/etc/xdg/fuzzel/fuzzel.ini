[main]
output=DSI-1
font=Roboto:size=20
use-bold=yes
dpi-aware=no
icon-theme=Adwaita
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords,comment
show-actions=yes
terminal=foot -e
anchor=center
lines=9
width=44
horizontal-pad=20
vertical-pad=20
inner-pad=8
line-height=50
layer=overlay
keyboard-focus=exclusive
prompt="APPS  "
placeholder=Search desktop apps

[colors]
background=111111fa
text=ffffff77
prompt=ffffffff
placeholder=ffffff77
input=ffffffff
match=ffffffff
selection=444444ff
selection-text=ffffffff
selection-match=ffffffff
border=111111ff

[border]
width=0
radius=20

[key-bindings]
execute=Return KP_Enter space
cancel=Escape
prev=Up Control+p
next=Down Control+n
