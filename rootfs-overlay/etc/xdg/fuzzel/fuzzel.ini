[main]
output=DSI-1
font=Noto Sans:size=22
use-bold=yes
dpi-aware=no
icon-theme=Adwaita
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords,comment
show-actions=yes
terminal=foot -e
anchor=center
lines=8
width=48
horizontal-pad=42
vertical-pad=30
inner-pad=20
line-height=46
layer=overlay
keyboard-focus=exclusive
prompt="Apps  "
placeholder=Type to search

[colors]
background=111318f5
text=d7dce6ff
prompt=9dd6ffff
placeholder=7f8795ff
input=f5f7fbff
match=9dd6ffff
selection=356a91ff
selection-text=ffffffff
selection-match=ffffffff
border=5da9ddff

[border]
width=3
radius=14

[key-bindings]
execute=Return KP_Enter space
cancel=Escape
prev=Up Control+p
next=Down Control+n
