[main]
output=DSI-1
font=Noto Sans:size=22
use-bold=yes
dpi-aware=no
icon-theme=Adwaita
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords,comment
show-actions=yes
terminal=foot -e
anchor=center
lines=8
width=48
horizontal-pad=36
vertical-pad=28
inner-pad=18
line-height=54
layer=overlay
keyboard-focus=exclusive
prompt="Apps  "
placeholder=Search desktop apps

[colors]
background=111111fa
text=aaaaaaff
prompt=ffffffff
placeholder=aaaaaaff
input=ffffffff
match=ffffffff
selection=444444ff
selection-text=ffffffff
selection-match=ffffffff
border=444444ff

[border]
width=2
radius=20

[key-bindings]
execute=Return KP_Enter space
cancel=Escape
prev=Up Control+p
next=Down Control+n
